[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem-guard"
version = "2.0.0"
description = "Memory Reliability & Governance: provenance/trust library plus a security, quota and audit gateway for NanoMemory vector memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mem-guard contributors" }]
keywords = ["ai", "memory", "governance", "provenance", "agents", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
mem-guard = "mem_guard.cli:main"

[project.urls]
Homepage = "https://github.com/xixin9988-sys/mem-guard"

[tool.setuptools]
packages = ["mem_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["mem_guard", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001 flags full-width CJK punctuation ("，", "？"); this product is bilingual by design.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection requires calling Depends() in signature defaults.
"mem_guard/server.py" = ["B008"]
